apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-microservices
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sohamdi2301-37/k8s-gitops-config.git'
    targetRevision: HEAD
    path: charts/frontend
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
