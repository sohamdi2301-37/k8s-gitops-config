apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: database-microservice
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/sohamdi2301-37/k8s-gitops-config.git'
    targetRevision: HEAD
    path: charts/database
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
